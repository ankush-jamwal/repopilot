services:
  qdrant:
    image: qdrant/qdrant
    ports: ["6333:6333"]
    volumes: [qdrant_data:/qdrant/storage]
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment: { QDRANT_URL: http://qdrant:6333, OLLAMA_URL: "http://host.docker.internal:11434" }
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on: [qdrant]
    ports: ["8000:8000"]
  frontend:
    build: ./frontend
    ports: ["3000:80"]
    depends_on: [backend]
volumes:
  qdrant_data:
